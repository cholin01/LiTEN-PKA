[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liten-pka"
version = "0.1.0"
description = "LiTEN-based pKaLearn reproduction pipeline with five conformers per molecule."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "torch>=2.0",
  "torch-geometric>=2.4",
  "torch-scatter>=2.1",
  "rdkit>=2023.9",
]

[tool.setuptools.packages.find]
where = ["src"]

